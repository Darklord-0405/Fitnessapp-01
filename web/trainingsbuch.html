<title>Trainingsbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Archivo:wght@400;500;600&display=swap">
<style>
/* Layout: eine schmale Spalte wie ein Trainingsbuch – Wochenleiste oben, Tagesliste, darunter der Coach. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18212b; --muted:#5d6b78; --line:#d6dde4;
  --accent:#2457d6; --accent-ink:#ffffff; --done:#1f8a5b; --done-soft:#dcf1e6;
  --band-a:#e4572e; --band-b:#2457d6; --band-run:#1f8a5b; --band-m:#c99a06;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151b; --surface:#19212a; --ink:#e8edf2; --muted:#93a1ae; --line:#2b3540;
  --accent:#6f95ff; --accent-ink:#0d1420; --done:#4cc68d; --done-soft:#173a2a;
  --band-a:#ff7a52; --band-b:#6f95ff; --band-run:#4cc68d; --band-m:#e6bb35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#19212a; --ink:#e8edf2; --muted:#93a1ae; --line:#2b3540;
  --accent:#6f95ff; --accent-ink:#0d1420; --done:#4cc68d; --done-soft:#173a2a;
  --band-a:#ff7a52; --band-b:#6f95ff; --band-run:#4cc68d; --band-m:#e6bb35; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:2.1rem;font-weight:800;line-height:1}
h2{font-size:1.35rem;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.weekbar{display:flex;align-items:center;gap:6px}
.weekbar .nav{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:52px;flex:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1;min-width:0}
.day{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.day .wd{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day .dn{font-family:var(--display);font-weight:700;font-size:1.1rem;line-height:1;font-variant-numeric:tabular-nums}
.day .pip{width:18px;height:4px;border-radius:2px;background:var(--line)}
.day.today .dn{color:var(--accent)}
.day.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pip.half{background:linear-gradient(90deg,var(--done) 50%,var(--line) 50%)}
.pip.full{background:var(--done)}
.weeklabel{font-size:.78rem;color:var(--muted);text-align:center;margin-top:-10px}

.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tag{width:10px;align-self:stretch;border-radius:3px;flex:none}
.bhead .meta{flex:1;min-width:0}
.bhead small{display:block;color:var(--muted);font-size:.8rem}
.count{font-family:var(--display);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.count.ok{color:var(--done)}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .txt{flex:1;min-width:0}
.row .txt div{font-weight:500}
.row .txt small{color:var(--muted);font-size:.8rem;display:block}
.sets{display:flex;gap:6px;flex:none}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-size:.8rem;font-weight:600;color:var(--muted);transition:background .15s,border-color .15s}
.chk.on{background:var(--done);border-color:var(--done);color:var(--surface)}
.chk.on::after{content:"✓";font-size:1rem}
.chk.on span{display:none}
.rest{padding:16px 14px;color:var(--muted)}
.row.done .txt div{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--done)}

.coach{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:.82rem}
.log{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto}
.msg{padding:9px 12px;border-radius:10px;font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;max-width:85%}
.msg.ai{background:var(--bg);align-self:flex-start;max-width:95%}
.proposal{border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.ask{display:flex;gap:8px}
.ask textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);color:var(--ink);font:inherit;min-height:44px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 16px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:.78rem;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.8rem;padding:4px 0}
.tbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);flex:none;display:grid;place-items:center;font-size:.8rem;color:var(--accent)}
.restset{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.seg{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:.82rem;font-variant-numeric:tabular-nums}
.seg.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.startbtn{margin:12px 14px;width:calc(100% - 28px)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--surface);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.timer .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer .lbl{flex:1;min-width:0}
.timer .lbl small{display:block;opacity:.7;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.timer .lbl div{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .clock{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.timer button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;min-width:44px;height:40px;padding:0 8px;font-size:.85rem}
.timer .bar{height:3px;background:var(--accent);margin:-12px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 10px;transform-origin:left;transition:transform .25s linear}
.timer.rest .bar{background:var(--band-m)}
.timer.end .clock{color:var(--band-m)}
body.timing{padding-bottom:110px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Trainingsbuch</h1>
    <p class="sub">2× Kraft mit Bändern · 1× Laufen · jeden Morgen 5 Minuten</p>
  </header>

  <div class="stats">
    <div class="stat"><b id="stWeek">0/3</b><span>Einheiten Woche</span></div>
    <div class="stat"><b id="stStreak">0</b><span>Tage Morgen-Serie</span></div>
    <div class="stat"><b id="stTotal">0</b><span>Einheiten gesamt</span></div>
  </div>

  <div class="weekbar">
    <button class="nav" id="prevW" aria-label="Vorherige Woche">‹</button>
    <div class="days" id="days"></div>
    <button class="nav" id="nextW" aria-label="Nächste Woche">›</button>
  </div>
  <div class="weeklabel" id="weekLabel"></div>

  <section id="dayView" style="display:flex;flex-direction:column;gap:12px"></section>

  <section class="coach" aria-labelledby="coachH">
    <div>
      <h2 id="coachH">KI-Coach</h2>
      <p class="sub">Frag nach Anpassungen. Änderungen am Plan übernimmst du erst nach deinem OK.</p>
    </div>
    <div class="chips" id="chips"></div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="ask">
      <textarea id="q" rows="1" placeholder="z. B. Mach Kraft B etwas schwerer"></textarea>
      <button class="btn" id="send">Senden</button>
    </div>
    <div class="foot">
      <span class="note" id="syncNote">Fortschritt wird gespeichert.</span>
      <button class="linkbtn" id="resetPlan">Plan auf Standard zurücksetzen</button>
    </div>
  </section>
</div>

<div class="timer" id="timer" hidden role="timer" aria-live="off">
  <div class="bar" id="tBar"></div>
  <div class="in">
    <div class="lbl"><small id="tKind">Pause</small><div id="tLabel"></div></div>
    <div class="clock" id="tClock">0:00</div>
    <button id="tPlus" aria-label="15 Sekunden mehr">+15</button>
    <button id="tPause" aria-label="Anhalten">❚❚</button>
    <button id="tStop" aria-label="Timer beenden">✕</button>
  </div>
</div>

<script>
(function(){
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
const DEFAULT_PLAN={
  days:{"1":"A","3":"run","5":"B"},
  sessions:{
    A:{name:"Kraft A",info:"Ganzkörper · ca. 40 Min · 60–90 s Pause",color:"a",items:[
      {name:"Aufwärmen",reps:"5 Min Hampelmänner, Arm- & Hüftkreisen",sets:1},
      {name:"Kniebeugen mit Band",reps:"10–15 Wdh.",sets:3},
      {name:"Rudern mit Band (Tür)",reps:"10–15 Wdh.",sets:3},
      {name:"Liegestütze",reps:"8–15 Wdh.",sets:3},
      {name:"Rumänisches Kreuzheben mit Band",reps:"10–15 Wdh.",sets:3},
      {name:"Schulterdrücken mit Band",reps:"10–12 Wdh.",sets:3},
      {name:"Unterarmstütz",reps:"30–60 Sek.",sets:3}]},
    run:{name:"Laufen",info:"Lockeres Tempo, du kannst dich noch unterhalten",color:"run",items:[
      {name:"Lockerer Dauerlauf",reps:"25–30 Min, alle 2 Wochen +5 Min",sets:1},
      {name:"Dehnen danach",reps:"5 Min Waden, Oberschenkel, Hüfte",sets:1}]},
    B:{name:"Kraft B",info:"Ganzkörper · ca. 40 Min · 60–90 s Pause",color:"b",items:[
      {name:"Aufwärmen",reps:"5 Min Hampelmänner, Arm- & Hüftkreisen",sets:1},
      {name:"Ausfallschritte rückwärts mit Band",reps:"8–12 pro Bein",sets:3},
      {name:"Latzug mit Band, kniend",reps:"10–15 Wdh.",sets:3},
      {name:"Brustpresse mit Band",reps:"10–15 Wdh.",sets:3},
      {name:"Hüftbrücke mit Miniband",reps:"15–20 Wdh.",sets:3},
      {name:"Face Pulls mit Band",reps:"12–15 Wdh.",sets:3},
      {name:"Pallof Press",reps:"10 pro Seite",sets:3}]}
  },
  morning:[
    {name:"Katze-Kuh",reps:"1 Min, ruhig atmen"},
    {name:"Weltbeste Dehnung",reps:"1 Min, Seiten abwechseln"},
    {name:"Kniebeugen ohne Gewicht",reps:"1 Min, 15–20 langsam"},
    {name:"Band-Pull-Aparts",reps:"1 Min"},
    {name:"Unterarmstütz + Atmen",reps:"30 Sek. + 30 Sek."}]
};
const clone=o=>JSON.parse(JSON.stringify(o));
let state={plan:clone(DEFAULT_PLAN),log:{}};
const LS="trainingsbuch-v1";
try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(s&&s.plan&&s.log)state=s;}catch(e){}

const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=new Date();today.setHours(12,0,0,0);
let sel=new Date(today);
let weekStart=mondayOf(today);
function mondayOf(d){const m=new Date(d);const wd=(m.getDay()+6)%7;m.setDate(m.getDate()-wd);m.setHours(12,0,0,0);return m;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}

function sessionFor(d){const id=state.plan.days[String(d.getDay())];return id&&state.plan.sessions[id]?{id,...state.plan.sessions[id]}:null;}
function entry(d){return state.log[key(d)]||{};}
function morningDone(d){const e=entry(d);return state.plan.morning.every((_,i)=>e["m|"+i]);}
function morningCount(d){const e=entry(d);return state.plan.morning.filter((_,i)=>e["m|"+i]).length;}
function sessCount(d,s){const e=entry(d);let t=0,c=0;s.items.forEach((it,i)=>{for(let k=0;k<(it.sets||1);k++){t++;if(e[s.id+"|"+i+"|"+k])c++;}});return{t,c};}
function sessDone(d){const s=sessionFor(d);if(!s)return null;const r=sessCount(d,s);return r.c===r.t;}

const bandVar={a:"--band-a",b:"--band-b",run:"--band-run"};

function el(tag,attrs,...kids){const n=document.createElement(tag);for(const k in attrs||{}){if(k==="class")n.className=attrs[k];else if(k.startsWith("on"))n.addEventListener(k.slice(2),attrs[k]);else n.setAttribute(k,attrs[k]);}kids.flat().forEach(c=>c!=null&&n.append(c));return n;}

function renderWeek(){
  const box=document.getElementById("days");box.textContent="";
  for(let i=0;i<7;i++){
    const d=addDays(weekStart,i);
    const s=sessionFor(d);
    const mc=morningCount(d), sd=s?sessCount(d,s):null;
    const any=mc>0||(sd&&sd.c>0);
    const full=morningDone(d)&&(!s||sd.c===sd.t);
    const pip=el("span",{class:"pip"+(full?" full":any?" half":"")});
    if(s&&!any)pip.style.background="var("+bandVar[s.color||"a"]+")",pip.style.opacity=".35";
    const b=el("button",{class:"day"+(key(d)===key(today)?" today":"")+(key(d)===key(sel)?" sel":""),onclick:()=>{sel=d;render();},"aria-label":d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})},
      el("span",{class:"wd"},WD[d.getDay()]),el("span",{class:"dn"},String(d.getDate())),pip);
    box.append(b);
  }
  const end=addDays(weekStart,6);
  document.getElementById("weekLabel").textContent=weekStart.toLocaleDateString("de-DE",{day:"numeric",month:"short"})+" – "+end.toLocaleDateString("de-DE",{day:"numeric",month:"short",year:"numeric"});
}

function toggle(k,ctx){const dk=key(sel);const e=state.log[dk]||(state.log[dk]={});const on=!e[k];if(on)e[k]=true;else delete e[k];save();render();
  if(on&&ctx&&ctx.rest&&restCfg.auto&&!ctx.last)startTimer({kind:"Satzpause",label:"Nächster Satz: "+ctx.next,secs:restCfg.secs,rest:true});}
function setOn(k){const dk=key(sel);const e=state.log[dk]||(state.log[dk]={});e[k]=true;}

// ---------- Timer ----------
let restCfg={secs:90,auto:true};
try{const r=JSON.parse(localStorage.getItem("tb-rest")||"null");if(r&&r.secs)restCfg=r;}catch(e){}
function saveRest(){try{localStorage.setItem("tb-rest",JSON.stringify(restCfg));}catch(e){}}
function durOf(s){const m=/(\d+)\s*(?:[–-]\s*\d+\s*)?(Sek|Min)/i.exec(s||"");if(!m)return 0;return parseInt(m[1])*(/min/i.test(m[2])?60:1);}
const T={el:document.getElementById("timer"),endAt:0,left:0,total:0,running:false,iv:null,cur:null,queue:[],wake:null};
let actx=null;
function beep(n){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+i*.28;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.24);}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(n>1?[200,100,200]:120);}catch(e){}}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+pad(s%60);}
function paint(){const left=T.running?(T.endAt-Date.now())/1000:T.left;
  document.getElementById("tClock").textContent=fmt(left);
  document.getElementById("tBar").style.transform="scaleX("+(T.total?Math.max(0,left/T.total):0)+")";
  T.el.classList.toggle("end",left<=3&&left>0);
  if(T.running&&left<=0)finish();}
async function lockOn(){try{if(navigator.wakeLock&&!T.wake)T.wake=await navigator.wakeLock.request("screen");}catch(e){}}
function lockOff(){try{T.wake&&T.wake.release();}catch(e){}T.wake=null;}
function startTimer(job,queue){
  clearInterval(T.iv);T.cur=job;T.queue=queue||[];T.total=job.secs;T.left=job.secs;T.endAt=Date.now()+job.secs*1000;T.running=true;
  document.getElementById("tKind").textContent=job.kind;document.getElementById("tLabel").textContent=job.label;
  document.getElementById("tPause").textContent="❚❚";document.getElementById("tPause").setAttribute("aria-label","Anhalten");
  T.el.classList.toggle("rest",!!job.rest);T.el.hidden=false;document.body.classList.add("timing");
  lockOn();paint();T.iv=setInterval(paint,250);
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume();}catch(e){}
}
function finish(){clearInterval(T.iv);T.running=false;const job=T.cur;beep(T.queue.length?1:3);
  if(job&&job.onDone)job.onDone();
  const next=T.queue.shift();
  if(next)startTimer(next,T.queue);else{document.getElementById("tClock").textContent="0:00";setTimeout(()=>{if(!T.running)stopTimer();},2500);}}
function stopTimer(){clearInterval(T.iv);T.running=false;T.queue=[];T.cur=null;T.el.hidden=true;document.body.classList.remove("timing");lockOff();}
document.getElementById("tStop").onclick=stopTimer;
document.getElementById("tPlus").onclick=()=>{if(T.running)T.endAt+=15000;else T.left+=15;T.total+=15;paint();};
document.getElementById("tPause").onclick=e=>{const b=e.currentTarget;
  if(T.running){T.left=(T.endAt-Date.now())/1000;T.running=false;clearInterval(T.iv);b.textContent="▶";b.setAttribute("aria-label","Weiter");}
  else if(T.cur){T.endAt=Date.now()+T.left*1000;T.running=true;T.iv=setInterval(paint,250);b.textContent="❚❚";b.setAttribute("aria-label","Anhalten");}};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&T.running){lockOn();paint();}});

function startMorning(){
  const jobs=state.plan.morning.map((it,i)=>({kind:"Morgenroutine "+(i+1)+"/"+state.plan.morning.length,label:it.name+" · "+it.reps,secs:60,
    onDone:()=>{const d=sel;setOn("m|"+i);save();render();}}));
  startTimer(jobs[0],jobs.slice(1));
}
function startExercise(s,i){
  const it=s.items[i];const secs=durOf(it.reps);if(!secs)return;
  const e=entry(sel);let k=0;while(k<(it.sets||1)-1&&e[s.id+"|"+i+"|"+k])k++;
  const n=it.sets||1;
  startTimer({kind:n>1?"Übung · Satz "+(k+1)+"/"+n:"Übung",label:it.name,secs,
    onDone:()=>{const kk=s.id+"|"+i+"|"+k;if(!entry(sel)[kk])toggle(kk,ctxFor(s,i,k));}});
}
function ctxFor(s,i,k){const n=s.items[i].sets||1;const lastSet=k===n-1;const lastItem=i===s.items.length-1;
  const nextName=lastSet?(s.items[i+1]&&s.items[i+1].name):s.items[i].name+" (Satz "+(k+2)+")";
  return{rest:s.id!=="run"&&n>1,last:lastSet&&lastItem,next:nextName||""};}

function renderDay(){
  const v=document.getElementById("dayView");v.textContent="";
  const title=sel.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  v.append(el("h2",{},title+(key(sel)===key(today)?" · heute":"")));
  // Morgenroutine
  const e=entry(sel);const mc=morningCount(sel);const mt=state.plan.morning.length;
  const mb=el("div",{class:"block"},
    el("div",{class:"bhead"},el("span",{class:"tag",style:"background:var(--band-m)"}),
      el("div",{class:"meta"},el("h3",{},"Morgenroutine"),el("small",{},"5 Minuten direkt nach dem Aufstehen")),
      el("span",{class:"count"+(mc===mt?" ok":"")},mc+"/"+mt)));
  state.plan.morning.forEach((it,i)=>{
    const k="m|"+i,on=!!e[k];
    mb.append(el("div",{class:"row"+(on?" done":"")},el("div",{class:"txt"},el("div",{},it.name),el("small",{},it.reps)),
      el("div",{class:"sets"},el("button",{class:"chk"+(on?" on":""),"aria-pressed":String(on),"aria-label":it.name+" abhaken",onclick:()=>toggle(k)},el("span",{},"")))));
  });
  if(mc<mt)mb.append(el("button",{class:"btn startbtn",onclick:startMorning},mc?"Routine neu starten (5 × 1 Min)":"Routine starten (5 × 1 Min)"));
  v.append(mb);
  // Einheit
  const s=sessionFor(sel);
  if(!s){v.append(el("div",{class:"block"},el("div",{class:"rest"},"Ruhetag. Spazieren, Radfahren oder einfach erholen.")));return;}
  const r=sessCount(sel,s);
  const sb=el("div",{class:"block"},
    el("div",{class:"bhead"},el("span",{class:"tag",style:"background:var("+bandVar[s.color||"a"]+")"}),
      el("div",{class:"meta"},el("h3",{},s.name),el("small",{},s.info||"")),
      el("span",{class:"count"+(r.c===r.t?" ok":"")},r.c+"/"+r.t)));
  s.items.forEach((it,i)=>{
    const n=it.sets||1;const sets=el("div",{class:"sets"});let all=true;
    for(let k=0;k<n;k++){const kk=s.id+"|"+i+"|"+k,on=!!e[kk];if(!on)all=false;
      sets.append(el("button",{class:"chk"+(on?" on":""),"aria-pressed":String(on),"aria-label":it.name+(n>1?" Satz "+(k+1):"")+" abhaken",onclick:()=>toggle(kk,ctxFor(s,i,k))},el("span",{},n>1?String(k+1):"")));}
    const secs=durOf(it.reps);
    const tb=secs&&!all?el("button",{class:"tbtn","aria-label":it.name+" Timer starten ("+fmt(secs)+")",title:fmt(secs),onclick:()=>startExercise(s,i)},"▶"):null;
    sb.append(el("div",{class:"row"+(all?" done":"")},el("div",{class:"txt"},el("div",{},it.name),el("small",{},it.reps+(n>1?" · "+n+" Sätze":"")+(it.note?" · "+it.note:""))),tb,sets));
  });
  if(s.id!=="run"&&s.items.some(x=>(x.sets||1)>1)){
    const rs=el("div",{class:"restset"},el("span",{},"Satzpause:"));
    [60,90,120].forEach(x=>rs.append(el("button",{class:"seg"+(restCfg.secs===x?" on":""),"aria-pressed":String(restCfg.secs===x),onclick:()=>{restCfg.secs=x;saveRest();render();}},x+" s")));
    rs.append(el("button",{class:"seg"+(restCfg.auto?" on":""),"aria-pressed":String(restCfg.auto),onclick:()=>{restCfg.auto=!restCfg.auto;saveRest();render();}},restCfg.auto?"Auto an":"Auto aus"));
    rs.append(el("button",{class:"seg",onclick:()=>startTimer({kind:"Satzpause",label:"Pause",secs:restCfg.secs,rest:true})},"▶ Jetzt"));
    sb.append(rs);
  }
  v.append(sb);
}

function renderStats(){
  let w=0,planned=0;
  for(let i=0;i<7;i++){const d=addDays(mondayOf(today),i);const s=sessionFor(d);if(s){planned++;if(sessDone(d))w++;}}
  document.getElementById("stWeek").textContent=w+"/"+planned;
  let st=0,d=new Date(today);if(!morningDone(d))d=addDays(d,-1);
  while(morningDone(d)&&st<3650){st++;d=addDays(d,-1);}
  document.getElementById("stStreak").textContent=st;
  let tot=0;for(const k in state.log){const dd=new Date(k+"T12:00:00");if(sessDone(dd))tot++;}
  document.getElementById("stTotal").textContent=tot;
}
function render(){renderWeek();renderDay();renderStats();}
document.getElementById("prevW").onclick=()=>{weekStart=addDays(weekStart,-7);sel=new Date(weekStart);render();};
document.getElementById("nextW").onclick=()=>{weekStart=addDays(weekStart,7);sel=new Date(weekStart);render();};

// Speichern: lokal sofort, dazu im persönlichen Speicher (geräteübergreifend), wenn verfügbar
let docRef=null,saveT=null;
function save(){
  try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  if(!docRef)return;clearTimeout(saveT);
  saveT=setTimeout(()=>{docRef.set({plan:state.plan,log:state.log,updated:Date.now()}).then(()=>note("Gespeichert.")).catch(()=>note("Nur auf diesem Gerät gespeichert."));},600);
}
function note(t){document.getElementById("syncNote").textContent=t;}
(async()=>{
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){note("Fortschritt wird auf diesem Gerät gespeichert.");return;}
    const id=await user.id();if(!id)return;
    docRef=db.doc("data/users/"+id+"/trainingsbuch");
    const snap=await docRef.get();
    if(snap.exists){const d=snap.data();if(d&&d.plan&&d.log){state={plan:d.plan,log:d.log};try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}render();}}
    else save();
    note("Wird in deinem Konto gespeichert, auf allen Geräten.");
  }catch(e){note("Fortschritt wird auf diesem Gerät gespeichert.");}
})();

// KI-Coach
const chipsTxt=["Heute habe ich nur 20 Minuten","Mein Knie zwickt – Alternativen?","Mach den Plan etwas schwerer","Wie lief meine letzte Woche?"];
const chipBox=document.getElementById("chips");
chipsTxt.forEach(t=>chipBox.append(el("button",{class:"chip",onclick:()=>ask(t)},t)));
const logBox=document.getElementById("log");const q=document.getElementById("q");const sendB=document.getElementById("send");
let turns=[],busy=false,sampleFn=null;
(async()=>{try{sampleFn=await claude.use("sample");}catch(e){}
  if(!sampleFn){document.querySelector(".coach .chips").hidden=true;document.querySelector(".ask").hidden=true;
    logBox.append(el("div",{class:"msg ai"},"Der KI-Coach ist in dieser Ansicht nicht verfügbar. Öffne die Seite in der Claude-App, um ihn zu nutzen."));}})();

function history(){
  const out=[];for(let i=13;i>=0;i--){const d=addDays(today,-i);const s=sessionFor(d);
    out.push(key(d)+" "+WD[d.getDay()]+": Morgen "+morningCount(d)+"/"+state.plan.morning.length+(s?", "+s.name+" "+sessCount(d,s).c+"/"+sessCount(d,s).t+" Sätze":", Ruhetag"));}
  return out.join("\n");
}
function validPlan(p){
  if(!p||typeof p!=="object"||!p.days||!p.sessions||!Array.isArray(p.morning))return false;
  for(const id in p.sessions){const s=p.sessions[id];if(!s||!s.name||!Array.isArray(s.items)||!s.items.every(i=>i&&i.name))return false;
    if(!["a","b","run"].includes(s.color))s.color="a";s.items.forEach(i=>{i.sets=Math.max(1,Math.min(6,parseInt(i.sets)||1));i.reps=String(i.reps||"");});}
  for(const d in p.days){if(!p.sessions[p.days[d]])return false;}
  return p.morning.every(m=>m&&m.name);
}
function addMsg(cls,t){const m=el("div",{class:"msg "+cls},t);logBox.append(m);logBox.scrollTop=logBox.scrollHeight;return m;}

async function ask(text){
  text=(text||"").trim();if(!text||busy||!sampleFn)return;
  busy=true;sendB.disabled=true;q.value="";
  addMsg("me",text);const bubble=addMsg("ai","Denke nach …");
  const sys="Du bist ein freundlicher, kompetenter Fitness-Coach und antwortest auf Deutsch, kurz und konkret (Du-Form). "+
   "Nutzer: 23 Jahre, männlich, trainiert zuhause mit Widerstandsbändern (Langband, Miniband, Türanker), 2× Kraft und 1× Laufen pro Woche, dazu eine tägliche 5-Minuten-Morgenroutine. "+
   "Bei Schmerzen, die stark sind oder länger anhalten, rätst du zu ärztlicher Abklärung. Keine Ernährungs- oder Medikamentenempfehlungen mit Zahlen.\n\n"+
   "Aktueller Plan (JSON; days: Wochentag 0=So…6=Sa → Session-ID; color ist \"a\",\"b\" oder \"run\"; schreibe Zeitangaben in reps als \"30 Sek.\" oder \"5 Min\", damit der Timer sie erkennt):\n"+JSON.stringify(state.plan)+
   "\n\nHeute: "+key(today)+" ("+WD[today.getDay()]+"). Ausgewählter Tag in der App: "+key(sel)+".\nVerlauf der letzten 14 Tage:\n"+history()+
   "\n\nAntworte NUR mit JSON: {\"antwort\": string, \"plan\": <kompletter neuer Plan im gleichen Schema> oder null, \"aenderung\": string (ein Satz, was sich ändert) oder \"\"}. "+
   "Gib nur dann einen neuen Plan zurück, wenn der Nutzer eine dauerhafte Änderung möchte. Für einmalige Tipps (z. B. heute weniger Zeit) plan = null und die Tipps in 'antwort'.";
  turns.push({role:"user",content:text});
  const msgs=[{role:"user",content:sys},{role:"assistant",content:"Verstanden."},...turns.slice(-6)];
  try{
    const res=await sampleFn.json(msgs,{cache:false,modelTier:"default"});
    const ans=String(res&&res.antwort||"Ich habe keine Antwort bekommen. Frag bitte noch einmal.");
    bubble.textContent=ans;turns.push({role:"assistant",content:ans});
    if(res&&res.plan&&validPlan(res.plan)){
      const p=res.plan;
      const box=el("div",{class:"proposal"},el("div",{},el("strong",{},"Vorschlag: "),res.aenderung||"Neuer Plan"));
      const yes=el("button",{class:"btn",onclick:()=>{state.plan=p;save();render();box.replaceWith(addMsg("ai","Plan übernommen."));}},"Übernehmen");
      const no=el("button",{class:"btn ghost",onclick:()=>{box.remove();}},"Verwerfen");
      box.append(el("div",{style:"display:flex;gap:8px"},yes,no));logBox.append(box);logBox.scrollTop=logBox.scrollHeight;
    }
  }catch(e){
    turns.pop();
    bubble.textContent=e&&e.code==="not_granted"?"Ohne deine Erlaubnis kann der Coach nicht antworten.":e&&e.code==="rate_limited"?"Gerade zu viele Anfragen. Versuch es in einer Minute noch einmal.":"Das hat nicht geklappt. Versuch es bitte noch einmal.";
  }
  busy=false;sendB.disabled=false;
}
sendB.onclick=()=>ask(q.value);
q.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(q.value);}});

const rp=document.getElementById("resetPlan");let armed=false;
rp.onclick=()=>{if(!armed){armed=true;rp.textContent="Wirklich zurücksetzen? Nochmal tippen";setTimeout(()=>{armed=false;rp.textContent="Plan auf Standard zurücksetzen";},4000);return;}
  armed=false;rp.textContent="Plan auf Standard zurücksetzen";state.plan=clone(DEFAULT_PLAN);save();render();addMsg("ai","Plan auf den Standard zurückgesetzt. Dein Fortschritt bleibt erhalten.");};

render();
})();
</script>

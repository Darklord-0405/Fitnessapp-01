plugins {
    id 'com.android.application'
}

android {
    namespace 'de.trainingsbuch.app'
    compileSdk 34

    defaultConfig {
        applicationId 'de.trainingsbuch.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signiert mit dem Debug-Schlüssel, damit die APK ohne eigenen Keystore installierbar ist
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

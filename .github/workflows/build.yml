name: APK bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Android SDK prüfen
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: APK bauen
        run: gradle --no-daemon assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Trainingsbuch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Trainingsbuch
          path: Trainingsbuch.apk
